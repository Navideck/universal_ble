group 'com.navideck.universal_ble'
version '1.0-SNAPSHOT'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.3.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'com.navideck.universal_ble'
    }

    compileSdkVersion 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
        // The scan filter conformance fixture is shared with the Dart and C++
        // tests (test/fixtures/scan_filter_cases.tsv), so it lives outside this
        // module and is exposed to the JVM tests as a resource.
        test.resources.srcDirs += '../test/fixtures'
    }

    defaultConfig {
        minSdkVersion 21
    }

    dependencies {
        testImplementation 'org.jetbrains.kotlin:kotlin-test'
        testImplementation 'org.mockito:mockito-core:5.12.0'
    }

    testOptions {
        unitTests {
            // GATT callbacks delegate to BluetoothGattCallback's default (empty)
            // implementations; without this the stub android.jar throws
            // "Stub!" instead of returning, so those callbacks cannot be driven
            // from a unit test.
            returnDefaultValues = true
            all {
                jvmArgs '-Dnet.bytebuddy.experimental=true'
                useJUnitPlatform()

                testLogging {
                   events "passed", "skipped", "failed", "standardOut", "standardError"
                   outputs.upToDateWhen {false}
                   showStandardStreams = true
                }
            }
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8)
    }
}
