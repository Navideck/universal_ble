name: Pull Request

on:
  pull_request:
    branches: [main]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: example
      - run: flutter build windows
        working-directory: example
      - run: cmake -S windows/test -B build/windows-tests
      - run: cmake --build build/windows-tests --config Debug
      - run: ctest --test-dir build/windows-tests -C Debug --output-on-failure

  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Nothing else builds the Apple sources. They are shared by iOS and macOS
      # and import Flutter's macOS or iOS module behind `#if os(...)`, so each
      # platform's branch is typechecked against its own engine framework.
      - name: Download the Apple engine frameworks
        run: flutter precache --macos --ios

      - name: Typecheck the Apple sources
        run: |
          set -euo pipefail
          flutter_root="$(dirname "$(dirname "$(command -v flutter)")")"
          engine="$flutter_root/bin/cache/artifacts/engine"
          sources=(darwin/universal_ble/Sources/universal_ble/*.swift)

          xcrun swiftc -typecheck \
            -target "$(uname -m)-apple-macos10.15" \
            -sdk "$(xcrun --sdk macosx --show-sdk-path)" \
            -F "$engine/darwin-x64" \
            "${sources[@]}"

          xcrun swiftc -typecheck \
            -target arm64-apple-ios13.1 \
            -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -F "$engine/ios/Flutter.xcframework/ios-arm64" \
            "${sources[@]}"

      # Each helper compiles one source file with counted checks; they are not
      # part of the plugin build.
      - name: Run the Apple helper tests
        run: |
          bash darwin/universal_ble/Tests/run_write_ownership_test.sh
          bash darwin/universal_ble/Tests/run_discovery_progress_test.sh
          bash darwin/universal_ble/Tests/run_central_restoration_owner_test.sh

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project source
        run: flutter analyze

      - name: Install HIL dependencies
        working-directory: hil
        run: flutter pub get

      - name: Analyze HIL source
        working-directory: hil
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install example dependencies
        working-directory: example
        run: flutter pub get

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Run Android unit tests
        working-directory: example/android
        run: gradle :universal_ble:testDebugUnitTest

      - name: Install Chrome
        uses: browser-actions/setup-chrome@latest

      - name: Run Flutter tests on Chrome
        uses: coactions/setup-xvfb@v1
        with:
          run: flutter test --platform chrome

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev

      - name: Build Linux
        working-directory: example
        run: flutter build linux

      - name: Build and run Windows backend unit tests
        run: |
          cmake -S windows/test -B build/windows-tests
          cmake --build build/windows-tests
          ctest --test-dir build/windows-tests --output-on-failure

  pana:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2

      - name: Install Dependencies
        run: |
          flutter packages get
          flutter pub global activate pana
          sudo apt-get install webp

