name: universal_ble_example
description: Demonstrates how to use the universal_ble plugin.
version: 1.0.0+1
publish_to: "none"

environment:
  sdk: ^3.3.0

dependencies:
  flutter:
    sdk: flutter
  convert: ^3.1.1
  expandable: ^5.0.1
  cupertino_icons: ^1.0.2
  universal_ble:
    path: ../

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: "../assets/universal_ble_icon_inverted.png"
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"
  windows:
    generate: true
    icon_size: 256
  macos:
    generate: true

flutter:
  uses-material-design: true
